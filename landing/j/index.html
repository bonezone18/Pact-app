<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Join a streak · Lockstep</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <main>
      <div class="brand">LOCKSTEP</div>
      <div>
        <p id="invited-by">You've been invited to a streak</p>
        <h1 id="title">One daily challenge. One shared streak.</h1>
      </div>
      <p id="status" hidden></p>
      <div id="code" class="code" aria-label="Invite code"></div>
      <p id="copy-hint" class="hint"></p>
      <div class="buttons" id="actions">
        <a id="open-app" class="button primary" href="#">Open in Lockstep</a>
        <a id="app-store" class="button" href="#">Download on the App Store</a>
        <a id="play-store" class="button" href="#">Get it on Google Play</a>
        <button id="copy" class="button" type="button">Copy code</button>
      </div>
      <p>Install Lockstep, then enter the code when the app asks “Got an invite code?”.</p>
    </main>
    <script src="/config.js"></script>
    <script src="/assets/landing.js"></script>
  </body>
</html>
